apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
data:
  kong.yaml: |
    _format_version: "1.1"
    services:
      - name: example-service
        url: http://example.com
        routes:
          - name: example-route
            paths:
              - /
            plugins:
              - name: oidc
                config:
                  client_id: kong-client
                  client_secret: secret
                  # URL de descubrimiento de Keycloak (ajusta el realm si es necesario)
                  discovery: http://keycloak:8080/auth/realms/master/.well-known/openid-configuration
                  scopes:
                    - openid
                    - profile
                    - email
