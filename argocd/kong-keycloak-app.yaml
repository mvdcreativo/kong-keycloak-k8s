apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kong-keycloak
  namespace: argocd
spec:
  project: default
  source:
    # Actualiza esta URL con la del repositorio donde alojas este código.
    repoURL: 'https://github.com/tu_usuario/kong-keycloak-argocd.git'
    targetRevision: HEAD
    path: .
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
